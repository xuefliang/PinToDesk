name: PinToDesk
options:
  bundleIdPrefix: com.pintodesk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  PinToDesk:
    type: application
    platform: iOS

    sources:
      - path: .
        excludes:
          - "project.yml"
          - "README.md"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pintodesk.ios
        INFOPLIST_FILE: Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_EMIT_LOC_STRINGS: "YES"
