name: iOS Build

on:
  push:
    branches: [ios, main]
    paths:
      - 'PinToDesk-iOS/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'PinToDesk-iOS/**'

jobs:
  build:
    name: Build & Archive
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PinToDesk-iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile (debug, no signing)
        run: |
          xcodebuild build \
            -project PinToDesk.xcodeproj \
            -scheme PinToDesk \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" | xcpretty

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project PinToDesk.xcodeproj \
            -scheme PinToDesk \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/PinToDesk.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" | xcpretty

      - name: Export unsigned .app bundle
        run: |
          mkdir -p $RUNNER_TEMP/export
          cp -R "$RUNNER_TEMP/PinToDesk.xcarchive/Products/Applications/PinToDesk.app" $RUNNER_TEMP/export/
          cd $RUNNER_TEMP/export
          zip -r PinToDesk.zip PinToDesk.app

      - name: Upload artifact (.app bundle)
        uses: actions/upload-artifact@v4
        with:
          name: PinToDesk-iOS-${{ github.sha }}
          path: ${{ runner.temp }}/export/PinToDesk.zip
          retention-days: 7

  # 在提供签名凭据时额外生成 IPA
  signed-ipa:
    name: Signed IPA (requires secrets)
    needs: build
    if: secrets.APPLE_TEAM_ID != ''
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PinToDesk-iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (signed)
        run: |
          xcodebuild archive \
            -project PinToDesk.xcodeproj \
            -scheme PinToDesk \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/PinToDesk.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic | xcpretty

      - name: Export IPA
        run: |
          mkdir -p $RUNNER_TEMP/export
          cat > $RUNNER_TEMP/export/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PinToDesk.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist $RUNNER_TEMP/export/ExportOptions.plist \
            -allowProvisioningUpdates | xcpretty

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PinToDesk-iOS-signed-${{ github.sha }}
          path: ${{ runner.temp }}/ipa/PinToDesk.ipa
          retention-days: 7
