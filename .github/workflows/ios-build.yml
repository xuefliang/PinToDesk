name: iOS Build

on:
  push:
    branches: [ios, main]
    paths:
      - 'PinToDesk-iOS/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'PinToDesk-iOS/**'

jobs:
  build:
    name: Build & Archive
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PinToDesk-iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile (debug, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PinToDesk.xcodeproj \
            -scheme PinToDesk \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" | xcpretty

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PinToDesk.xcodeproj \
            -scheme PinToDesk \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/PinToDesk.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" | xcpretty

      - name: Debug - list archive contents
        if: always()
        run: |
          echo "=== RUNNER_TEMP ==="
          ls -la "$RUNNER_TEMP" || true
          echo "=== Archive path ==="
          ls -la "$RUNNER_TEMP/PinToDesk.xcarchive" || true
          echo "=== Products tree ==="
          find "$RUNNER_TEMP/PinToDesk.xcarchive" -maxdepth 5 -name "*.app" 2>/dev/null || true
          echo "=== Full tree ==="
          find "$RUNNER_TEMP/PinToDesk.xcarchive" -maxdepth 4 2>/dev/null || true

      - name: Export unsigned .app bundle
        run: |
          mkdir -p $RUNNER_TEMP/export
          # Try multiple possible .app locations
          APP_PATH=$(find "$RUNNER_TEMP/PinToDesk.xcarchive" -name "*.app" -type d -maxdepth 5 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" $RUNNER_TEMP/export/
          cd $RUNNER_TEMP/export
          zip -r PinToDesk.zip PinToDesk.app

      - name: Upload artifact (.app bundle)
        uses: actions/upload-artifact@v4
        with:
          name: PinToDesk-iOS-${{ github.sha }}
          path: ${{ runner.temp }}/export/PinToDesk.zip
          retention-days: 7
