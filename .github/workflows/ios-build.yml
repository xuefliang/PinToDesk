name: iOS Build

on:
  push:
    branches: [ios, main]
    paths:
      - 'PinToDesk-iOS/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'PinToDesk-iOS/**'

jobs:
  build:
    name: Build & Archive
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PinToDesk-iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile (debug, no signing)
        run: |
          xcodebuild build \
            -project PinToDesk.xcodeproj \
            -scheme PinToDesk \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" | xcpretty

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project PinToDesk.xcodeproj \
            -scheme PinToDesk \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/PinToDesk.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" | xcpretty

      - name: Export unsigned .app bundle
        run: |
          mkdir -p $RUNNER_TEMP/export
          cp -R "$RUNNER_TEMP/PinToDesk.xcarchive/Products/Applications/PinToDesk.app" $RUNNER_TEMP/export/
          cd $RUNNER_TEMP/export
          zip -r PinToDesk.zip PinToDesk.app

      - name: Upload artifact (.app bundle)
        uses: actions/upload-artifact@v4
        with:
          name: PinToDesk-iOS-${{ github.sha }}
          path: ${{ runner.temp }}/export/PinToDesk.zip
          retention-days: 7
